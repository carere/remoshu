name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run check

      - name: Check types
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit

      - name: Run Worker integration tests
        run: bun run test:integration

      - name: Build Worker
        run: bun run build

      - name: Install pinned moon client
        env:
          MOON_ARCHIVE_SHA256: dc41e819932d4d109de460de01330bc52f93009a14c39720cd751b6771bcc349
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/moonrepo/moon/releases/download/v2.4.5/moon_cli-x86_64-unknown-linux-gnu.tar.xz \
            --output "${RUNNER_TEMP}/moon.tar.xz"
          echo "${MOON_ARCHIVE_SHA256}  ${RUNNER_TEMP}/moon.tar.xz" | sha256sum --check
          tar --extract --xz --file "${RUNNER_TEMP}/moon.tar.xz" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/moon_cli-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      - name: Run moon remote-cache end-to-end test
        run: bun run test:e2e
